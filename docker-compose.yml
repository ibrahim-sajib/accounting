services:
  mysql:
    image: mysql:8.0
    container_name: accounting-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: accounting_erp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: accounting
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: accounting-erp-app
    container_name: accounting-erp-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: accounting_erp
      DB_USERNAME: accounting
      DB_PASSWORD: secret
      APP_URL: http://localhost:8000
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: accounting-erp-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql_data: